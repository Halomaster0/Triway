name: Update vehicle database

# Pulls the latest NRCan fuel consumption ratings (new model years are added
# a few times a year) and commits the rebuilt src/data/vehicles.json.
on:
  schedule:
    - cron: "17 9 3 * *" # monthly
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/fetch-nrcan.ts
      - run: npm run data:vehicles
      - run: npm test
      - name: Commit if changed
        run: |
          if git diff --quiet -- data/raw/nrcan src/data/vehicles.json && [ -z "$(git ls-files --others --exclude-standard data/raw/nrcan)" ]; then
            echo "No changes"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/raw/nrcan src/data/vehicles.json
          git commit -m "Update vehicle database from NRCan"
          git push
